<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitwall team</title>
<link rel="stylesheet" href="pages.css">
<script src="demo-api.js"></script>
</head>
<body>
<main class="wide">
  <p><a href="./">← Back to Pitwall</a></p>
  <h1>Team</h1>
  <p class="lede">Everyone who can sign in to this Pi. Admins manage the team; editors can also sync MyGeotab and import data; staff work tickets and work orders.</p>
  <table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="4">Loading…</td></tr></tbody></table>
  <section id="addBox" hidden>
    <h2>Add someone</h2>
    <form id="add" class="grid" novalidate>
      <div class="field"><label for="aName">Name</label><input id="aName" autocomplete="off"></div>
      <div class="field"><label for="aUser">Username</label><input id="aUser" autocomplete="off" autocapitalize="none"></div>
      <div class="field"><label for="aPass">Starting password</label><input id="aPass" type="text" autocomplete="off" placeholder="At least 8 characters"></div>
      <div class="field"><label for="aRole">Role</label><select id="aRole"><option value="staff">Staff</option><option value="editor">Editor</option><option value="admin">Admin</option></select></div>
      <button class="btn primary" type="submit">Add person</button>
    </form>
  </section>
  <section>
    <h2>Change your password</h2>
    <form id="pw" class="grid" novalidate>
      <div class="field"><label for="newPw">New password</label><input id="newPw" type="password" autocomplete="new-password"></div>
      <button class="btn" type="submit">Change password</button>
    </form>
  </section>
  <section><button class="btn" id="out" type="button">Sign out</button></section>
  <p class="toast" id="toast" role="status" hidden></p>
</main>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); }, me = null;
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function call(path, body){ return fetch(path, { method: body ? 'POST' : 'GET', headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined }).then(function(r){ if (r.status === 401) { location.href = 'login.html'; throw new Error(''); } return r.json().then(function(j){ if (!r.ok) throw new Error(j.error || 'Failed'); return j; }); }); }
  function toast(m){ var t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function(){ t.hidden = true; }, 4000); }
  var ROLE = { admin:'Admin', editor:'Editor', staff:'Staff' };
  function load(){
    Promise.all([call('/api/state'), call('/api/users')]).then(function(r){
      me = r[0].user; $('addBox').hidden = me.role !== 'admin';
      $('rows').innerHTML = r[1].users.map(function(u){
        return '<tr><td>' + esc(u.name) + (u.isMe ? ' <span class="muted">(you)</span>' : '') + '</td><td>' + esc(u.username) + '</td><td>' + ROLE[u.role] + '</td><td class="r">'
          + (me.role === 'admin' && !u.isMe ? '<button class="btn sm" data-reset="' + esc(u.id) + '">Reset password</button> <button class="btn sm" data-rm="' + esc(u.id) + '" data-n="' + esc(u.name) + '">Remove</button>' : '') + '</td></tr>';
      }).join('');
    }).catch(function(e){ if (e.message) toast(e.message); });
  }
  document.addEventListener('click', function(ev){
    var b = ev.target.closest('button'); if (!b) return;
    if (b.id === 'out') return call('/api/logout', {}).then(function(){ location.href = 'login.html'; });
    if (b.dataset.rm) { if (b.dataset.confirm) call('/api/users/remove', { id: b.dataset.rm }).then(function(){ toast('Removed'); load(); }, function(e){ toast(e.message); }); else { b.dataset.confirm = '1'; b.textContent = 'Confirm remove ' + b.dataset.n; } }
    if (b.dataset.reset) { var np = Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6); call('/api/users/password', { id: b.dataset.reset, password: np }).then(function(){ toast('New password: ' + np + '. Give it to them; they can change it here.'); }, function(e){ toast(e.message); }); }
  });
  $('add').addEventListener('submit', function(ev){ ev.preventDefault();
    call('/api/users', { name: $('aName').value.trim(), username: $('aUser').value.trim(), password: $('aPass').value, role: $('aRole').value })
      .then(function(){ toast('Added ' + $('aName').value.trim() + '. Give them their username and starting password.'); $('add').reset(); load(); }, function(e){ toast(e.message); }); });
  $('pw').addEventListener('submit', function(ev){ ev.preventDefault();
    call('/api/users/password', { password: $('newPw').value }).then(function(){ toast('Password changed'); $('newPw').value = ''; }, function(e){ toast(e.message); }); });
  load();
})();
</script>
</body>
</html>
