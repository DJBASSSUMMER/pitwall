<title>Pitwall</title>
<script>
/* Pitwall on WordPress: small adapter that loads before the app.
   - Reads go out as POST (marked as reads), so no web cache ever keeps a copy.
   - Live updates: WordPress can't hold a connection open, so the page asks
     "what changed?" every few seconds, and right after you save something. */
(function () {
  'use strict';
  var BASE = '/pitwall/app/api/', realFetch = window.fetch.bind(window);
  var pollers = [];
  function isApi(url) { try { var u = new URL(url, location.href); return u.origin === location.origin && u.pathname.indexOf(BASE) === 0 ? u.pathname : null; } catch (e) { return null; } }
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : input.url, p = isApi(url);
    if (!p) return realFetch(input, init);
    init = Object.assign({ credentials: 'same-origin' }, init || {});
    var method = (init.method || 'GET').toUpperCase();
    if (method === 'GET') { init.method = 'POST'; init.body = '{}'; init.headers = Object.assign({ 'Content-Type': 'application/json' }, init.headers || {}, { 'X-Pitwall-Get': '1' }); }
    var writes = p === BASE + 'db' && init.body && !/"op"\s*:\s*"(list|get)"/.test(String(init.body));
    return realFetch(url, init).then(function (r) { if (writes || p.indexOf(BASE + 'geotab/') === 0 || p.indexOf(BASE + 'users') === 0) pollers.forEach(function (x) { x.soon(); }); return r; });
  };
  var RealES = window.EventSource;
  window.EventSource = function (url) {
    if (!isApi(url)) return new RealES(url);
    var s = { onmessage: null, onerror: null, onopen: null, readyState: 1 }, seq = 0, timer = null, busy = false, closed = false, again = false;
    function wait() { return document.hidden ? 30000 : 4000; }
    function schedule(ms) { clearTimeout(timer); if (!closed) timer = setTimeout(poll, ms); }
    function poll() {
      if (busy) { again = true; return; }
      busy = true;
      realFetch(BASE + 'changes', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ since: seq }) })
        .then(function (r) { if (r.status === 401) { location.href = '/pitwall/app/login'; return null; } return r.ok ? r.json() : null; })
        .then(function (j) {
          if (!j) return;
          var first = !seq; seq = j.seq || seq;
          if (first) { if (s.onopen) s.onopen(); return; }
          (j.paths || []).forEach(function (path) { if (s.onmessage) s.onmessage({ data: JSON.stringify({ path: path }) }); });
        }, function () { if (s.onerror) s.onerror(); })
        .then(function () { busy = false; if (again) { again = false; schedule(300); } else schedule(wait()); });
    }
    s.soon = function () { schedule(400); };
    s.close = function () { closed = true; clearTimeout(timer); pollers = pollers.filter(function (x) { return x !== s; }); };
    pollers.push(s);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) schedule(200); });
    schedule(0);
    return s;
  };
})();

</script>
<script>
/* Self-hosted bridge: gives the Pitwall web app the same window.claude.use()
   calls it uses on claude.ai, answered by this WordPress site instead. */
(function () {
  'use strict';
  function api(path, body) {
    return fetch(path, { method: body === undefined ? 'GET' : 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: body === undefined ? undefined : JSON.stringify(body) })
      .then(function (r) {
        if (r.status === 401) { location.href = '/pitwall/app/login'; return new Promise(function () {}); }
        return r.json().then(function (j) { if (!r.ok) { var e = new Error(j.error || 'Request failed'); e.code = j.code || (r.status === 403 ? 'invalid_argument' : 'error'); throw e; } return j; });
      });
  }
  function dbOp(op, path, extra) { return api('/pitwall/app/api/db', Object.assign({ op: op, path: path }, extra || {})); }

  /* live updates: one event stream, listeners keyed by collection path */
  var watchers = [], es = null;
  function parentOf(p) { var s = p.split('/'); s.pop(); return s.join('/'); }
  function ensureStream() {
    if (es) return;
    es = new EventSource('/pitwall/app/api/events');
    es.onmessage = function (ev) {
      var p; try { p = JSON.parse(ev.data).path; } catch (e) { return; }
      var col = parentOf(p);
      watchers.forEach(function (w) { if (w.col === col) w.poke(); });
    };
    es.onerror = function () { /* the browser reconnects by itself */ };
    es.onopen = function () { watchers.forEach(function (w) { w.poke(); }); };
  }
  function snapDocs(list) { return { docs: list.map(function (d) { return { id: d.id, data: function () { return d.data; } }; }), size: list.length, empty: !list.length }; }

  function query(col, order, lim) {
    function apply(docs) {
      if (order) docs.sort(function (a, b) { var x = a.data[order.f], y = b.data[order.f]; var c = x < y ? -1 : x > y ? 1 : 0; return order.d === 'desc' ? -c : c; });
      return lim ? docs.slice(0, lim) : docs;
    }
    return {
      orderBy: function (f, d) { return query(col, { f: f, d: d || 'asc' }, lim); },
      limit: function (n) { return query(col, order, n); },
      get: function () { return dbOp('list', col).then(function (r) { return snapDocs(apply(r.docs)); }); },
      add: function (data) { return dbOp('add', col, { data: data }).then(function (r) { return { id: r.id }; }); },
      doc: function (id) { return docRef(col + '/' + id); },
      onSnapshot: function (cb, err) {
        var alive = true, timer = null;
        function load() { dbOp('list', col).then(function (r) { if (alive) cb(snapDocs(apply(r.docs))); }, function (e) { if (alive && err) err(e); }); }
        var w = { col: col, poke: function () { clearTimeout(timer); timer = setTimeout(load, 80); } };
        watchers.push(w); ensureStream(); load();
        return function () { alive = false; watchers = watchers.filter(function (x) { return x !== w; }); };
      }
    };
  }
  function docRef(path) {
    return {
      get: function () { return dbOp('get', path).then(function (r) { return { exists: r.exists, data: function () { return r.data; } }; }); },
      set: function (data) { return dbOp('set', path, { data: data }); },
      update: function (data) { return dbOp('update', path, { data: data }); },
      delete: function () { return dbOp('delete', path); },
      acquire: function (o) { return dbOp('acquire', path, { ttlMs: o && o.ttlMs }); },
      collection: function (c) { return query(path + '/' + c); }
    };
  }
  var db = { collection: function (p) { return query(p); }, doc: function (p) { return docRef(p); } };

  var meP = null, peopleP = null;
  function me() { return meP || (meP = api('/pitwall/app/api/state').then(function (s) { if (!s.user) { location.href = '/pitwall/app/login'; return new Promise(function () {}); } return s.user; })); }
  function people() { return peopleP || (peopleP = api('/pitwall/app/api/users').then(function (r) { setTimeout(function () { peopleP = null; }, 30000); return r.users; })); }
  var user = {
    id: function () { return me().then(function (u) { return u.id; }); },
    me: function () { return me().then(function (u) { return { id: u.id, name: u.name, isMe: true }; }); },
    isOwner: function () { return me().then(function (u) { return u.role === 'admin'; }); },
    canEdit: function () { return me().then(function (u) { return u.role === 'admin' || u.role === 'editor'; }); },
    can: function () { return Promise.resolve(true); },
    profiles: function (ids) { return Promise.all([people(), me()]).then(function (r) { var out = {}; ids.forEach(function (id) { var p = r[0].filter(function (x) { return x.id === id; })[0]; if (p) out[id] = { id: id, name: p.name, isMe: id === r[1].id }; }); return out; }); },
    search: function (q) { q = String(q || '').toLowerCase(); return people().then(function (list) { return list.filter(function (p) { return !q || (p.name + ' ' + p.username).toLowerCase().indexOf(q) >= 0; }).slice(0, 10).map(function (p) { return { id: p.id, name: p.name, isMe: p.isMe }; }); }); }
  };
  var downloads = {
    save: function (o) {
      var blob = o.data instanceof Blob ? o.data : new Blob([o.data], { type: /\.csv$/i.test(o.filename) ? 'text/csv' : 'application/octet-stream' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = o.filename || 'download';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
      return Promise.resolve();
    }
  };
  /* The server syncs MyGeotab itself; the page only asks it to. */
  var mcp = { selfHosted: true, callTool: function () { return Promise.reject({ code: 'capability_disabled', message: 'Sync runs from the Data page.' }); } };
  var caps = { db: db, user: user, downloads: downloads, mcp: mcp };
  window.claude = { use: function (name) { return Promise.resolve(caps[name] || null); } };
  window.pitwallApi = api;
})();

</script>

<style>

  --purple-bg:#EDE4F7; --purple:#5B2F8C; --muted-bg:#E7E9E4; --muted-fg:#3F454C; --ok-bg:#E3EFE6; --ok:#2F5E3A; --cng-bg:#D7F0EC; --cng:#0E5A52;

}

  --line:#2C3136; --line-2:#23272B; --accent:#F97316; --accent-ink:#16191D; --focus:#9CC3F5;
  --nav:#0A0B0D; --nav-ink:#E9EBE6; --nav-muted:#9AA1A9; --nav-active:#22262B; --nav-badge:#FDBA74;
  --crit-bg:#3A1E12; --crit:#FDBA8C; --warn-bg:#3A2E0E; --warn:#FCD34D; --info-bg:#142338; --info:#9CC3F5;
  --purple-bg:#2A1D3A; --purple:#D3B8F5; --muted-bg:#262A2F; --muted-fg:#C3C8CE; --ok-bg:#16301E; --ok:#9AD7A8; --cng-bg:#0F2D2A; --cng:#8ED8CC;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0F1113; --surface:#171A1D; --surface-2:#1D2125; --ink:#ECEEEA; --ink-2:#CDD1D6; --muted:#A3AAB2;
  --line:#2C3136; --line-2:#23272B; --accent:#F97316; --accent-ink:#16191D; --focus:#9CC3F5;

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.45}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
a{color:var(--info)}
.app{display:flex; flex-wrap:wrap; min-height:100vh}
.rail{flex:1 1 224px; max-width:100%; background:var(--nav); color:var(--nav-ink); padding:24px 16px; display:flex; flex-direction:column; gap:24px}
.brand{display:flex; flex-direction:column; gap:2px; padding:0 8px}
.brand b{display:flex; align-items:center; gap:10px; font-size:20px; letter-spacing:-0.01em}
.brand span{font-size:12px; color:var(--nav-muted)}
.brand b .ver{font-size:11px; font-weight:600; color:var(--nav-badge); border:1px solid var(--nav-active); border-radius:999px; padding:1px 8px; letter-spacing:0; white-space:nowrap}
.nav{display:flex; flex-direction:column; gap:2px}
.nav a{display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:44px; padding:0 12px; border-radius:8px; color:#C9CDD2; text-decoration:none}
.nav a[aria-current="page"]{background:var(--nav-active); color:#FFFFFF; font-weight:600}
.nav a:hover{background:var(--nav-active)}
.nav .n{font-family:var(--mono); font-size:12px; color:var(--nav-badge); font-variant-numeric:tabular-nums}
.rail-foot{margin-top:auto; font-size:12px; color:var(--nav-muted); border-top:1px solid var(--nav-active); padding:14px 8px 0; display:flex; flex-direction:column; gap:4px}
main{flex:999 1 560px; min-width:0; padding-block:28px 56px; padding-inline:clamp(16px, 3vw, 40px); display:flex; flex-direction:column; gap:24px}
@media (max-width:860px){
  .rail{flex-basis:100%; padding:14px 16px; gap:12px}
  .nav{flex-direction:row; overflow-x:auto; gap:4px}
  .nav a{white-space:nowrap}
  .rail-foot{display:none}
}
.eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:0.06em; color:var(--muted); text-transform:uppercase}
h1{margin:0; font-size:clamp(26px, 3.2vw, 34px); line-height:1.15; letter-spacing:-0.02em; text-wrap:balance}
h2{margin:0; font-size:18px; font-weight:600}
h3{margin:0; font-size:15px; font-weight:600}
.lede{margin:0; color:var(--muted); max-width:68ch}
.head{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:16px}
.head > div{display:flex; flex-direction:column; gap:6px; min-width:0}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.split{display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start}
.split > .main{flex:3 1 560px; min-width:0}
.split > .side{flex:2 1 320px; min-width:0}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; min-width:0}
.panel-h{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line-2)}
.panel-b{padding:16px 20px; display:flex; flex-direction:column; gap:14px}
.kpis{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:12px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; display:flex; flex-direction:column; gap:4px}
.kpi .l{font-size:13px; color:var(--muted)}
.kpi .v{font-family:var(--mono); font-size:28px; font-weight:600; font-variant-numeric:tabular-nums}
.kpi .v.bad{color:var(--crit)}
.kpi .s{font-size:12px; color:var(--muted)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:0 14px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:600; font-size:14px; cursor:pointer; text-decoration:none; white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.dark{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--info)}
.btn[disabled]{opacity:0.5; cursor:not-allowed}
.btn.sm{min-height:36px; padding:0 10px; font-size:13px}
.chip{display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap}
.t-crit{background:var(--crit-bg); color:var(--crit)} .t-warn{background:var(--warn-bg); color:var(--warn)}
.t-info{background:var(--info-bg); color:var(--info)} .t-purple{background:var(--purple-bg); color:var(--purple)}
.t-muted{background:var(--muted-bg); color:var(--muted-fg)} .t-ok{background:var(--ok-bg); color:var(--ok)}
.t-cng{background:var(--cng-bg); color:var(--cng)} .cng-tag{margin-left:6px; padding:1px 7px; font-size:11px; vertical-align:2px}
.note.cng-note{background:var(--cng-bg); color:var(--ink-2); border-left:4px solid var(--cng)} .note.cng-note strong{color:var(--cng)}
.seg{display:flex; flex-wrap:wrap; gap:6px}
.seg button{min-height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:13px; font-weight:600; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.q{list-style:none; margin:0; padding:0}
.q li{display:flex; flex-wrap:wrap; gap:14px; align-items:center; padding:16px 20px; border-top:1px solid var(--line-2)}
.q li:first-child{border-top:0}
.q .sev{min-width:80px; justify-content:center}
.q .body{flex:1 1 280px; min-width:0; display:flex; flex-direction:column; gap:2px}
.q .kind{font-family:var(--mono); font-size:11px; letter-spacing:0.05em; color:var(--muted); text-transform:uppercase}
.q .imp{font-family:var(--mono); font-weight:600; min-width:110px; text-align:right; font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:14px}
th{text-align:left; font-size:12px; font-weight:600; color:var(--muted); padding:10px 12px; background:var(--surface-2); white-space:nowrap}
td{padding:11px 12px; border-top:1px solid var(--line-2); vertical-align:middle}
th:first-child,td:first-child{padding-left:20px} th:last-child,td:last-child{padding-right:20px}
td.num,th.num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
tr.sel td{background:var(--info-bg)}
tr.done td{opacity:0.5}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.sub{font-size:12px; color:var(--muted)}
.bad{color:var(--crit); font-weight:600}
.tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px}
.tile{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:12px 14px; min-height:44px; border-radius:12px; cursor:pointer; border:2px solid transparent}
.tile[aria-pressed="true"]{border-color:currentColor}
.tile .c{font-family:var(--mono); font-size:24px; font-weight:600}
.tile .lb{font-weight:600; font-size:14px}
.tile .h{font-size:12px; opacity:0.85}
.field{display:flex; flex-direction:column; gap:4px; min-width:0}
.field label{font-size:12px; font-weight:600; color:var(--muted)}
.input, select.input, textarea.input{min-height:44px; padding:8px 12px; border:1px solid var(--line); border-radius:9px; background:var(--surface); width:100%}
textarea.input{min-height:72px; resize:vertical}
.facts{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0; font-size:14px}
.facts dt{color:var(--muted)} .facts dd{margin:0; min-width:0; overflow-wrap:anywhere}
.note{background:var(--surface-2); border-radius:10px; padding:12px 14px; font-size:14px; color:var(--ink-2); display:flex; flex-direction:column; gap:4px}
.onb-list{list-style:none; margin:0; padding:0}
.onb-list li{display:flex; gap:14px; align-items:center; padding:14px 20px; border-top:1px solid var(--line-2)}
.onb-list li:first-child{border-top:0}
.onb-n{flex:0 0 30px; height:30px; border-radius:50%; display:grid; place-items:center; font-weight:700; background:var(--surface-2); color:var(--ink-2)}
.onb-list li.done .onb-n{background:var(--ok-bg); color:var(--ok)}
.onb-t{flex:1 1 auto; display:flex; flex-direction:column; gap:2px; min-width:0; overflow-wrap:anywhere}
.onb{margin-bottom:4px}
@media (max-width:600px){.onb-list li{flex-wrap:wrap} .onb-list li .btn,.onb-list li .chip{margin-left:44px}}
.empty{padding:28px 20px; color:var(--muted); display:flex; flex-direction:column; gap:10px; align-items:flex-start}
.bar{position:sticky; bottom:12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; background:var(--ink); color:var(--bg); padding:10px 14px; border-radius:12px}
.bar .btn{border-color:transparent}
.meter{height:8px; border-radius:999px; background:var(--muted-bg); overflow:hidden}
.meter > span{display:block; height:100%; background:var(--info)}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom, 0px)); background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:10px; font-size:14px; max-width:calc(100vw - 32px); z-index:10}
.drop{border:2px dashed var(--line); border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:10px; align-items:flex-start}
.drop.over{border-color:var(--info); background:var(--info-bg)}
.results{list-style:none; margin:0; padding:0; border:1px solid var(--line); border-radius:10px; background:var(--surface); overflow:hidden}

.thread{display:flex; flex-direction:column; gap:10px}
.msg{border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--surface); display:flex; flex-direction:column; gap:6px; min-width:0}

<script>
/* Pitwall engine: shared by the hosted app and the MyGeotab Add-in.
   Pure functions only. No DOM, no network. */
(function (root) {
  'use strict';
  var H = 3600e3, D = 24 * H;

  var CAUSES = {
    unplugged:    { label: 'Likely unplugged',  hint: 'Power removed with ignition off', tone: 'crit' },
    disconnect:   { label: 'Battery disconnect (CNG)', hint: 'CNG master switch likely turned off', tone: 'cng' },
    voltage:      { label: 'Wiring / voltage',  hint: 'Low or unstable supply',          tone: 'warn' },
    gps:          { label: 'No GPS fix',        hint: 'Ignition seen, no location',      tone: 'info' },
    seasonal:     { label: 'Parked / seasonal', hint: 'Normal shutdown, idle 14+ days',  tone: 'muted' },
    notinstalled: { label: 'Never installed',   hint: 'Activated, no trips ever',        tone: 'purple' },
    unknown:      { label: 'Needs a look',      hint: 'No clear signal before silence',  tone: 'muted' }
  };
  var CAUSE_ORDER = ['unplugged', 'disconnect', 'voltage', 'gps', 'notinstalled', 'seasonal', 'unknown'];

  var SIGNALS = ['power_removed', 'battery_disconnect', 'low_voltage', 'reboot_loop', 'ignition_no_gps', 'normal_shutdown', 'normal', ''];

  function t(x) { if (x == null || x === '') return null; var v = typeof x === 'number' ? x : Date.parse(x); return isNaN(v) ? null : v; }

  function fmtAgo(ms) {
    if (ms == null || !isFinite(ms)) return 'never';
    if (ms < H) return Math.max(1, Math.round(ms / 60e3)) + ' min';
    if (ms < D) return Math.round(ms / H) + ' h';
    var d = Math.floor(ms / D), h = Math.round((ms - d * D) / H);
    return d < 3 && h ? d + ' d ' + h + ' h' : d + ' d';
  }

  /* d: normalized device. flags: {seasonal:bool}. Returns classification. */
  function classifyDevice(d, asOf, flags) {
    flags = flags || {};
    var last = t(d.lastCommAt), act = t(d.activatedAt), trip = t(d.lastTripAt);
    var silentMs = last == null ? Infinity : Math.max(0, asOf - last);
    var r = { serial: d.serial, silent: false, silentMs: silentMs, cause: null, archived: !!d.archived, cng: !!d.isCng };
    if (d.archived) return r;
    if (!trip && act != null && asOf - act > 7 * D) {
      r.silent = true; r.cause = 'notinstalled'; r.silentMs = asOf - act; return r;
    }
    if (silentMs < D) return r;
    r.silent = true;
    if (flags.seasonal) { r.cause = 'seasonal'; r.flagged = true; return r; }
    switch (d.lastSignal) {
      case 'power_removed': r.cause = 'unplugged'; break;

      case 'battery_disconnect': r.cause = 'disconnect'; r.routine = !!d.routine; r.expected = r.routine && silentMs < 3 * D; break;
      case 'low_voltage': case 'reboot_loop': r.cause = 'voltage'; break;
      case 'ignition_no_gps': r.cause = 'gps'; break;
      case 'normal_shutdown': r.cause = silentMs > 14 * D ? 'seasonal' : 'unknown'; break;

  }

  /* Several units at one customer losing power within a 3-hour window

  function markBatches(devices, cls) {
    var byCust = {};
    devices.forEach(function (d) {
      var c = cls[d.serial];
      if (c && c.cause === 'unplugged') (byCust[d.customerId] = byCust[d.customerId] || []).push(d);
    });
    Object.keys(byCust).forEach(function (cid) {
      var list = byCust[cid].slice().sort(function (a, b) { return t(a.lastCommAt) - t(b.lastCommAt); });
      for (var i = 0; i < list.length; i++) {
        var group = [list[i]];
        for (var j = 0; j < list.length; j++) {
          if (j !== i && Math.abs(t(list[j].lastCommAt) - t(list[i].lastCommAt)) <= 3 * H) group.push(list[j]);
        }
        if (group.length >= 3) group.forEach(function (g) {
          var c = cls[g.serial];
          if (!c.batch || c.batchSize < group.length) { c.batch = true; c.batchSize = group.length; }
        });
      }
    });
  }

  function nextStep(c) {
    if (!c || !c.silent) return 'Reporting normally.';
    switch (c.cause) {
      case 'unplugged': return c.batch
        ? c.batchSize + ' units at this customer lost power within hours of each other. That points to shop work, not drivers. Ask the fleet manager before sending an installer. Stored records upload once the units are plugged back in.'
        : 'Power was removed with the ignition off. Check with the driver or fleet manager; if the device was pulled on purpose, consider a harness install in a less accessible spot.';
      case 'disconnect': return c.expected
        ? 'This CNG vehicle’s battery disconnect is switched off most nights, and it has been off less than three days (a weekend, say). The tracker reconnects when the switch goes back on. Nothing to do yet.'
        : (c.routine ? 'This CNG vehicle’s battery disconnect is normally switched off overnight, but it has been off much longer than usual. ' : 'The tracker lost power minutes after a normal shutdown with a healthy battery, which matches a CNG battery disconnect being switched off. ')
          + 'Ask the fleet manager whether the vehicle is parked with the switch off. Stored data uploads once it is back on. The switch is a safety device on CNG vehicles, so don’t ask drivers to leave it on, and don’t rewire the tracker around it without the fleet’s sign-off.';
      case 'voltage': return 'Supply voltage was low or unstable before it went quiet. Book an installer to check the harness and connection.';
      case 'gps': return 'The vehicle is running but not getting a location fix. Usually antenna placement or obstruction: inspect where the device is mounted.';
      case 'seasonal': return 'Normal shutdown and parked for weeks. Confirm with the customer that the vehicle is out of service for the season.';
      case 'notinstalled': return 'Activated but has never recorded a trip. Confirm the device was installed and is plugged in.';
      default: return 'No clear signal before it went quiet. Ask the customer whether the vehicle is in use.';
    }
  }

  /* Full analysis over a normalized dataset. */
  function analyze(data) {

    var devices = data.devices || [], customers = data.customers || [], flags = data.flags || {};

    var cls = {};
    devices.forEach(function (d) { cls[d.serial] = classifyDevice(d, asOf, flags[d.serial]); });
    markBatches(devices, cls);
    var health = {};
    customers.forEach(function (c) { health[c.id] = { units: 0, active: 0, reporting: 0, silent: 0, pmTracked: 0, pmOk: 0, causes: {} }; });
    devices.forEach(function (d) {
      var h = health[d.customerId] || (health[d.customerId] = { units: 0, active: 0, reporting: 0, silent: 0, pmTracked: 0, pmOk: 0, causes: {} });
      h.units++;
      var c = cls[d.serial];
      if (d.archived) return;
      h.active++;
      if (c.silent) { h.silent++; h.causes[c.cause] = (h.causes[c.cause] || 0) + 1; } else h.reporting++;
      if (d.milesToService != null && d.milesToService !== '' && isFinite(+d.milesToService)) { h.pmTracked++; if (+d.milesToService >= 0) h.pmOk++; }
    });

      var h = health[cid], c = custById[cid] || {};
      h.reportingPct = h.active ? h.reporting / h.active * 100 : null;
      h.pmPct = h.pmTracked ? h.pmOk / h.pmTracked * 100 : null;
      var login = t(c.lastAdminLoginAt);
      h.loginDays = login == null ? null : Math.floor((asOf - login) / D);
      var ren = t(c.renewalAt);
      h.renewalDays = ren == null ? null : Math.ceil((ren - asOf) / D);
      h.churnRisk = h.loginDays != null && h.loginDays >= 30;
    });

  }

  /* One ranked list of things a person should act on. */
  function queue(data, A) {
    var items = [], groups = {};
    (data.devices || []).forEach(function (d) {
      var c = A.cls[d.serial];
      if (!c || !c.silent || c.expected || c.cause === 'seasonal' || c.cause === 'notinstalled') return;
      var key = d.customerId + '~' + c.cause + (c.batch ? '~batch' : '');
      var g = groups[key] || (groups[key] = { customerId: d.customerId, cause: c.cause, batch: !!c.batch, serials: [], maxSilent: 0 });
      g.serials.push(d.serial); g.maxSilent = Math.max(g.maxSilent, c.silentMs);
    });
    Object.keys(groups).forEach(function (k) {
      var g = groups[k], n = g.serials.length, cz = CAUSES[g.cause];
      var text = g.cause === 'disconnect'
        ? n + (n === 1 ? ' CNG vehicle' : ' CNG vehicles') + ' silent, battery disconnect likely left off. Longest: ' + fmtAgo(g.maxSilent) + '.'
        : g.batch
        ? n + ' vehicles lost power within hours of each other, likely during shop work.'
        : n + (n === 1 ? ' vehicle' : ' vehicles') + ' silent, ' + cz.label.toLowerCase().replace('cng', 'CNG') + '. Longest: ' + fmtAgo(g.maxSilent) + '.';
      items.push({ id: 'dev~' + k, cat: 'devices', sev: g.cause === 'unknown' || g.cause === 'disconnect' ? 'Risk' : 'Critical', customerId: g.customerId, kind: cz.label, text: text, impactLabel: n + (n === 1 ? ' vehicle' : ' vehicles'), score: n * 40 + (g.batch ? 200 : 0), route: 'devices', filter: { customerId: g.customerId, cause: g.cause } });
    });
    Object.keys(A.health).forEach(function (cid) {
      var h = A.health[cid];
      if (!h.churnRisk) return;
      var txt = 'No admin login for ' + h.loginDays + ' days.' + (h.renewalDays != null && h.renewalDays > 0 ? ' Renewal in ' + h.renewalDays + ' days.' : '');
      items.push({ id: 'cust~' + cid, cat: 'customers', sev: 'Risk', customerId: cid, kind: 'Adoption', text: txt, impactLabel: 'Renewal risk', score: 300 + (h.renewalDays != null && h.renewalDays < 90 ? 400 : 0), route: 'customers', filter: { customerId: cid } });
    });

  }

  /* ---- CSV ---- */
  function parseCSV(text) {
    var rows = [], row = [], f = '', q = false, i = 0, s = String(text || '').replace(/^﻿/, '');

        else f += ch;
      } else if (ch === '"') q = true;

      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && s[i + 1] === '\n') i++;

  var DEVICE_COLS = ['serial', 'customerId', 'vehicle', 'lastCommAt', 'lastSignal', 'activatedAt', 'lastTripAt', 'archived', 'milesToService', 'isCng'];
  var CUSTOMER_COLS = ['id', 'name', 'database', 'lastAdminLoginAt', 'renewalAt'];

  function pick(o, names) { for (var i = 0; i < names.length; i++) { var v = o[names[i]]; if (v != null && v !== '') return v; } return ''; }

  function cngVal(v) { v = String(v || '').trim(); return /^(1|true|yes|y)$/i.test(v) || /\bcng\b|compressed natural gas/i.test(v); }

  /* Returns {devices, errors}. Accepts loose header names. */
  function rowsToDevices(rows) {
    var out = [], errors = [], seen = {};
    rows.forEach(function (r, i) {
      var serial = pick(r, ['serial', 'serialnumber', 'deviceserial', 'device']);
      var cust = pick(r, ['customerid', 'customer', 'database', 'customername', 'account']);
      if (!serial) { errors.push('Row ' + (i + 2) + ': missing serial'); return; }
      if (!cust) { errors.push('Row ' + (i + 2) + ': missing customer'); return; }
      if (seen[serial]) { errors.push('Row ' + (i + 2) + ': duplicate serial ' + serial + ' (kept the first)'); return; }
      seen[serial] = 1;
      var sig = pick(r, ['lastsignal', 'signal', 'lastevent']).toLowerCase().replace(/[^a-z_]/g, '_');
      if (SIGNALS.indexOf(sig) < 0) { errors.push('Row ' + (i + 2) + ': unknown lastSignal "' + sig + '", treated as blank'); sig = ''; }

        serial: serial.replace(/[^A-Za-z0-9_.\-]/g, ''),
        customerId: slug(cust),
        customerName: cust,
        vehicle: pick(r, ['vehicle', 'vehiclename', 'name', 'asset']) || 'Unassigned',
        lastCommAt: iso(pick(r, ['lastcommat', 'lastcommunicated', 'lastseen', 'datetime'])),
        lastSignal: sig,
        activatedAt: iso(pick(r, ['activatedat', 'billingstartdate', 'activationdate'])),
        lastTripAt: iso(pick(r, ['lasttripat', 'lasttrip'])),
        archived: bool(pick(r, ['archived', 'inactive'])),
        milesToService: mts === '' || !isFinite(+mts) ? null : +mts,
        isCng: cngVal(pick(r, ['iscng', 'cng', 'fueltype', 'fuel']))
      });
    });
    return { devices: out, errors: errors };
  }

  function rowsToCustomers(rows) {
    var out = [], errors = [];
    rows.forEach(function (r, i) {
      var name = pick(r, ['name', 'customername', 'customer']);
      var id = slug(pick(r, ['id', 'customerid']) || name);
      if (!id) { errors.push('Row ' + (i + 2) + ': missing customer name'); return; }
      out.push({ id: id, name: name || id, database: pick(r, ['database', 'db']), lastAdminLoginAt: iso(pick(r, ['lastadminloginat', 'lastlogin', 'lastadminlogin'])), renewalAt: iso(pick(r, ['renewalat', 'renewal', 'renewaldate'])) });
    });

  }

  var api = { CAUSES: CAUSES, CAUSE_ORDER: CAUSE_ORDER, SIGNALS: SIGNALS, DEVICE_COLS: DEVICE_COLS, CUSTOMER_COLS: CUSTOMER_COLS,

  root.PitwallEngine = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
(function(){
'use strict';
var E = window.PitwallEngine;
var H = 3600e3;
var S = {
  db:null, user:null, uid:null, canEdit:false, dl:null, failed:false,
  ready:{}, customers:[], devices:[], deviceDocIds:[], meta:null, flags:{}, actions:[], tickets:[],
  route:'portfolio', qFilter:'all', search:'',
  dev:{cause:'', customerId:'', text:'', sel:{}, open:null, form:null},
  cust:{open:null},
  fleet:{customerId:''},
  sup:{status:'open', mine:false, priority:'', customerId:'', text:'', open:null, creating:null, tab:'reply', msgs:[], unsub:null},
  imp:null, confirmRemove:false,
  mcp:null, geoCfg:null, geo:{status:{}, syncing:false, err:''}
};
var A = null;

/* ---------- support constants ---------- */
var STATUS = { 'new':'New', open:'Open', waiting:'Waiting on customer', resolved:'Resolved', closed:'Closed' };
var STATUS_TONE = { 'new':'t-info', open:'t-purple', waiting:'t-warn', resolved:'t-ok', closed:'t-muted' };
var PRIORITIES = ['Urgent','High','Normal','Low'];
var PRIORITY_TONE = { Urgent:'t-crit', High:'t-warn', Normal:'t-muted', Low:'t-muted' };
var CATEGORIES = ['Device issue','Installation','Account access','Reports & data','Training','Other'];
/* Hours to first response and to resolution, by priority. */
var SLA = { Urgent:{resp:1, res:8}, High:{resp:4, res:24}, Normal:{resp:8, res:72}, Low:{resp:24, res:168} };

/* ---------- helpers ---------- */
function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(id){ return document.getElementById(id); }
function pct(n){ return n == null ? '–' : Math.round(n) + '%'; }
function custName(id){ var c = A && A.custById[id]; return c ? c.name : (id || '–'); }
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 3600); }
function dateLabel(ms){ if (ms == null) return '–'; return new Date(ms).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}); }
function dateTimeLabel(ms){ if (ms == null) return '–'; return new Date(ms).toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}); }
function ago(ms){ return ms == null ? '–' : E.fmtAgo(Date.now() - ms) + ' ago'; }
function toneOf(cause){ return 't-' + (E.CAUSES[cause] ? E.CAUSES[cause].tone : 'muted'); }
var SIGNAL_LABEL = { power_removed:'Power removed, ignition off', battery_disconnect:'Shutdown, then power cut (CNG switch)', low_voltage:'Low supply voltage', reboot_loop:'Repeated reboots', ignition_no_gps:'Ignition on, no GPS fix', normal_shutdown:'Normal shutdown', normal:'Normal trip end', '':'No events recorded' };
function cngTag(d){ return d && d.isCng ? '<span class="chip t-cng cng-tag" title="CNG vehicle: may have a battery disconnect switch">CNG</span>' : ''; }
function period(){ return new Date(A.asOf).toISOString().slice(0,7); }
function deviceBySerial(serial){ for (var i = 0; i < S.devices.length; i++) if (S.devices[i].serial === serial) return S.devices[i]; return null; }
function who(uid){ return uid ? '<span data-uid="' + esc(uid) + '">' + (uid === S.uid ? 'You' : 'Someone') + '</span>' : 'Pitwall'; }
function fillNames(){
  if (!S.user) return;
  var ids = [];
  document.querySelectorAll('[data-uid]').forEach(function(s){ var u = s.getAttribute('data-uid'); if (u && ids.indexOf(u) < 0) ids.push(u); });
  if (!ids.length) return;
  S.user.profiles(ids).then(function(ps){
    document.querySelectorAll('[data-uid]').forEach(function(s){ var p = ps[s.getAttribute('data-uid')]; if (p) s.textContent = p.isMe ? 'You' : (p.name || 'Someone'); });
  });
}
function nowIso(){ return new Date().toISOString(); }
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

/* ---------- tickets ---------- */
function ticketById(id){ for (var i = 0; i < S.tickets.length; i++) if (S.tickets[i]._id === id) return S.tickets[i]; return null; }
function isOpen(t){ return t.status === 'new' || t.status === 'open' || t.status === 'waiting'; }
function slaOf(t){
  var p = SLA[t.priority] || SLA.Normal, created = E.time(t.createdAt), now = Date.now();
  if (!isOpen(t)) return {state:'done', label:STATUS[t.status]};
  if (t.status === 'waiting') return {state:'paused', label:'Waiting on customer'};
  var first = !t.firstResponseAt, due = created + (first ? p.resp : p.res) * H, left = due - now;
  return {state: left < 0 ? 'overdue' : left < 2 * H ? 'soon' : 'ok', what: first ? 'First response' : 'Resolution', due: due, left: left,

function nextTicketNumber(){
  var ref = S.db.doc('counters/tickets');
  var maxSeen = S.tickets.reduce(function(m, t){ return Math.max(m, +t.number || 0); }, 1000);
  function attempt(k){
    return ref.acquire({holder: S.uid || 'viewer', ttlMs: 5000}).then(function(r){
      if (!r.acquired) { if (k >= 6) return Promise.reject({code:'busy'}); return wait(250 + Math.random() * 500).then(function(){ return attempt(k + 1); }); }
      return ref.get().then(function(s){
        var n = Math.max(s.exists && +s.data().next ? +s.data().next : 1001, maxSeen + 1);
        return ref.update({next: n + 1}).then(function(){ return n; });

    });

}
/* t: {subject, customerId, category, priority, contact, serials, source, assignee, briefKey}; firstMsg: {kind, body, from} */
function createTicket(t, firstMsg){

    var serials = t.serials || [];

      assignee:t.assignee || null, contact:t.contact || '', serials:serials, vehicles:serials.map(function(s){ var d = deviceBySerial(s); return d ? d.vehicle : s; }),
      source:t.source || 'staff', createdBy:S.uid, createdAt:now, updatedAt:now, firstResponseAt:null, resolvedAt:null };
    if (t.briefKey) { doc.briefKey = t.briefKey; doc.briefPeriod = period(); }
    var msgs = S.db.collection('tickets/' + id + '/messages');
    return S.db.doc('tickets/' + id).set(doc)
      .then(function(){ return msgs.add({kind:'event', event:'created', by:S.uid, at:now}); })
      .then(function(){ return firstMsg && firstMsg.body ? msgs.add({kind:firstMsg.kind || 'request', body:firstMsg.body, from:firstMsg.from || '', by:S.uid, at:nowIso()}) : null; })
      .then(function(){ return {id:id, number:n}; });
  });
}

}

/* Support */
function filteredTickets(){
  var f = S.sup, txt = f.text.trim().toLowerCase().replace(/^#/, '');
  return S.tickets.filter(function(t){
    if (f.status === 'open' && !isOpen(t)) return false;
    if (f.status === 'unassigned' && (!isOpen(t) || t.assignee)) return false;
    if (f.status === 'overdue' && slaOf(t).state !== 'overdue') return false;
    if (f.status === 'closed' && isOpen(t)) return false;
    if (f.mine && t.assignee !== S.uid) return false;
    if (f.priority && t.priority !== f.priority) return false;
    if (f.customerId && t.customerId !== f.customerId) return false;
    if (txt && String(t.number) !== txt && (t.subject || '').toLowerCase().indexOf(txt) < 0 && (t.contact || '').toLowerCase().indexOf(txt) < 0) return false;
    return true;
  }).sort(function(a, b){
    var oa = isOpen(a), ob = isOpen(b);
    if (oa && ob) { var sa = slaOf(a), sb = slaOf(b); var la = sa.state === 'paused' ? 1e15 : sa.left, lb = sb.state === 'paused' ? 1e15 : sb.left; return la - lb; }
    if (oa !== ob) return oa ? -1 : 1;
    return (E.time(b.updatedAt) || 0) - (E.time(a.updatedAt) || 0);
  });
}

function saveFile(name, text){
  if (!S.dl) { toast('Downloads aren’t available in this view.'); return; }
  S.dl.save({filename:name, data:text}).then(function(){ toast('Saved ' + name); }, function(e){ if (e && e.code !== 'declined') toast('Couldn’t save the file.'); });
}
function openItem(id){
  var it = (S._queue || []).filter(function(x){ return x.id === id; })[0]; if (!it) return;
  if (it.ticket) openTicket(it.ticket);
  else if (it.route === 'devices') { S.dev.customerId = it.filter.customerId; S.dev.cause = it.filter.cause; S.dev.open = null; location.hash = '#devices'; }
  else { S.cust.open = it.filter.customerId; location.hash = '#customers'; }
}
function setSeasonal(serials, on){
  var ps = serials.map(function(s){ var ref = S.db.doc('flags/' + s); return on ? ref.set({seasonal:true, by:S.uid, at:nowIso()}) : ref.delete(); });
  return write(Promise.all(ps), on ? 'Marked ' + serials.length + ' as parked' : 'Unmarked');
}
function devicePrefill(serials){
  var d0 = deviceBySerial(serials[0]), c = A.cls[serials[0]];
  var cause = c && c.cause ? E.CAUSES[c.cause].label.toLowerCase().replace('cng', 'CNG') : 'not reporting';
  return { customerId: d0 ? d0.customerId : '', serials: serials, category:'Device issue', source:'device',
    priority: c && c.batch ? 'High' : 'Normal',
    subject: serials.length === 1 ? (d0 ? d0.vehicle : serials[0]) + ': ' + cause : serials.length + ' vehicles: ' + cause,
    body: c ? 'Pitwall: ' + E.nextStep(c) : '' };
}
function chunkWrites(devs){
  var byC = {}; devs.forEach(function(d){ (byC[d.customerId] = byC[d.customerId] || []).push(d); });
  var docs = {};
  Object.keys(byC).forEach(function(cid){ var l = byC[cid]; for (var i = 0, n = 1; i < l.length; i += 400, n++) docs[cid + '--' + n] = {customerId:cid, chunk:n, devices:l.slice(i, i + 400)}; });
  return docs;
}
function applyImport(mode, asOfVal){
  var p = S.imp; if (!p) return;
  var incoming = p.devices.map(function(d){ var o = Object.assign({}, d); delete o.customerName; return o; });
  var result;
  if (mode === 'replace') result = incoming;
  else { var map = {}; S.devices.forEach(function(d){ map[d.serial] = d; }); incoming.forEach(function(d){ map[d.serial] = d; }); result = Object.keys(map).map(function(k){ return map[k]; }); }
  var docs = chunkWrites(result), ops = [];
  Object.keys(docs).forEach(function(id){ ops.push(S.db.doc('devices/' + id).set(docs[id])); });
  S.deviceDocIds.forEach(function(id){ if (!docs[id]) ops.push(S.db.doc('devices/' + id).delete()); });
  var known = {}; S.customers.forEach(function(c){ known[c.id] = 1; });
  p.devices.forEach(function(d){ if (!known[d.customerId]) { known[d.customerId] = 1; ops.push(S.db.doc('customers/' + d.customerId).set({id:d.customerId, name:d.customerName || d.customerId})); } });
  ops.push(S.db.doc('settings/meta').set({asOf: asOfVal ? new Date(asOfVal).toISOString() : nowIso(), source:'import', filename:p.filename, importedAt:nowIso(), importedBy:S.uid}));
  write(Promise.all(ops), 'Imported ' + incoming.length + ' devices').then(function(ok){ if (ok) { S.imp = null; schedule(); } });
}
function importCustomers(text, filename){
  var r = E.rowsToCustomers(E.parseCSV(text));
  if (!r.customers.length) { toast('No customers found in ' + filename + '. Check the header row.'); return; }
  var ops = r.customers.map(function(c){
    var ex = A.custById[c.id] || {};
    var o = Object.assign({}, ex, {id:c.id, name:c.name || ex.name});
    ['database','lastAdminLoginAt','renewalAt'].forEach(function(k){ if (c[k]) o[k] = c[k]; });
    return S.db.doc('customers/' + c.id).set(o);
  });
  write(Promise.all(ops), 'Updated ' + r.customers.length + ' customers' + (r.errors.length ? ' (' + r.errors.length + ' rows skipped)' : ''));
}
function readFile(file, cb){
  if (!file) return;
  if (!/\.csv$/i.test(file.name) && file.type && file.type.indexOf('csv') < 0 && file.type !== 'text/plain') { toast(file.name + ' isn’t a CSV file.'); return; }
  var fr = new FileReader(); fr.onload = function(){ cb(String(fr.result), file.name); }; fr.onerror = function(){ toast('Couldn’t read ' + file.name + '.'); }; fr.readAsText(file);
}
function loadDeviceFile(text, name){
  var r = E.rowsToDevices(E.parseCSV(text));
  if (!r.devices.length) { toast('No devices found in ' + name + '. It needs serial and customer columns.'); return; }
  S.imp = {filename:name, devices:r.devices, errors:r.errors}; schedule();
}
function removeExample(){
  var ex = {}; S.customers.forEach(function(c){ if (c.example) ex[c.id] = 1; });
  var ops = Object.keys(ex).map(function(c){ return S.db.doc('customers/' + c).delete(); });
  S.deviceDocIds.forEach(function(d){ if (ex[d.split('--')[0]]) ops.push(S.db.doc('devices/' + d).delete()); });
  S.tickets.filter(function(t){ return t.example; }).forEach(function(t){
    ops.push(S.db.collection('tickets/' + t._id + '/messages').get().then(function(s){ return Promise.all(s.docs.map(function(m){ return S.db.doc('tickets/' + t._id + '/messages/' + m.id).delete(); })); }).then(function(){ return S.db.doc('tickets/' + t._id).delete(); }));
  });
  if (S.meta && S.meta.source === 'example') ops.push(S.db.doc('settings/meta').set({asOf:nowIso(), source:'empty'}));
  S.confirmRemove = false;
  return write(Promise.all(ops), 'Example data removed');
}

document.addEventListener('change', function(ev){

  if (t.id === 'devCust') { S.dev.customerId = t.value; S.dev.sel = {}; schedule(); return; }

  if (t.id === 'supPrio') { S.sup.priority = t.value; schedule(); return; }
  if (t.id === 'supCust') { S.sup.customerId = t.value; schedule(); return; }
